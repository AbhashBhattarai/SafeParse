{% extends "base.html" %}

{% block title %}Log In — SafeParse{% endblock %}

{% block content %}
<div class="card auth-card">
    <h2>Log In to SafeParse</h2>
    <p>Sign in with your developer or administrator credentials.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn btn-secondary" style="width: 100%;">Log In</button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
        Need an account? <a href="{{ url_for('register') }}">Register here</a>.
    </div>
</div>
{% endblock %}
